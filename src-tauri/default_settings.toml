# Valores de fábrica compartidos por LTerminal y WTerminal.
#
# No se copia automáticamente al perfil del usuario: `Preferences` lo carga,
# lo valida y lo expone al frontend. El archivo existe para que los valores por
# defecto sean auditables sin recorrer código Rust.

language = "auto"
scriptsHereDepth = 3
autoStartDocker = false
exclusiveAccordionGroups = true
autoOpenFirstGroup = false
showSystemBanner = true
# `clear`/`cls` vuelve a mostrar el mismo fastfetch tras limpiar la pantalla.
clearReprintBanner = true
# Elementos ocultos del banner, separados por comas. Vacío = información completa.
bannerHiddenItems = "host,kernel,environment,motherboard,gpu,storage,datetime"
# Imagen a la izquierda del banner: el logo de la app o una propia (ruta
# absoluta en bannerImagePath), en bannerImageColumns columnas (8-40).
bannerImage = true
bannerImageColumns = 20
bannerImagePath = ""
showDependenciesPanel = true
showProjectsPanel = true
showScriptsPanel = true
showQuickActions = true
# LTools es una integración experimental y permanece oculta hasta que el
# usuario la habilita explícitamente desde Ajustes.
ltoolsEnabled = false
showExplorerPanel = true
showTabBar = true
showEnvironmentSelector = true
showRefreshButton = true
showLanguageButton = true
# Oculta las barras de controles y deja solo la terminal. Se puede recuperar
# con el atajo configurable de abajo.
terminalOnlyMode = false
# Muestra una guía dentro de la terminal limpia para recuperar el modo normal.
showTerminalOnlyGuide = true
# Maximiza la ventana al iniciar, sin obligar a usar siempre ese tamaño.
startMaximized = false
startAsAdmin = false
# Si NSudo está instalado y WTerminal no es administrador (y no hay gsudo ni el
# sudo de Windows en línea), ofrece instalar gsudo: así cada pestaña de NSudo
# pide el UAC solo para ella. «No volver a ofrecer» lo apaga.
offerGsudo = true
manualAliasesText = ""
favoriteReplIds = ""
hiddenEnvironmentIds = ""

# Atajos globales. Se guardan como combinaciones normalizadas para poder
# reasignarlos sin que el frontend dependa de la distribución del teclado.
# La paleta de comandos agrupa con búsqueda las acciones de la aplicación.
shortcutCommandPalette = "Ctrl+Shift+P"
shortcutNewTab = "Ctrl+Shift+T"
shortcutNextTab = "Ctrl+Tab"
shortcutPreviousTab = "Ctrl+Shift+Tab"
shortcutCyclePanes = "Ctrl+Shift+Backslash"
shortcutToggleExplorer = "Ctrl+Shift+E"
shortcutToggleTerminalOnly = "Ctrl+Shift+M"
# Navegación entre terminales: Ctrl izquierdo + W/A/S/D.
shortcutPaneLeft = "Ctrl+A"
shortcutPaneRight = "Ctrl+D"
shortcutPaneUp = "Ctrl+W"
shortcutPaneDown = "Ctrl+S"
# Acciones sin asignación de fábrica: se pueden grabar desde Ajustes.
shortcutOpenSettings = ""
shortcutOpenProjects = ""
shortcutOpenScripts = ""
shortcutOpenDependencies = ""
shortcutClosePanel = ""
shortcutRefreshEnvironments = ""
shortcutExplorerFollow = ""
shortcutExplorerCd = ""
shortcutClearTerminal = ""
shortcutSearchTerminal = "Ctrl+Shift+F"
shortcutSearchHistory = "Ctrl+Shift+R"
shortcutPreviousCommand = "Ctrl+Shift+ArrowUp"
shortcutNextCommand = "Ctrl+Shift+ArrowDown"
shortcutUiScaleUp = "Ctrl+Alt+Equal"
shortcutUiScaleDown = "Ctrl+Alt+Minus"
shortcutUiScaleReset = "Ctrl+Alt+0"
shortcutOpenSystemExplorer = ""
# Sin tecla de fábrica: se asignan en Ajustes → Atajos.
shortcutCloseTab = ""
shortcutRenameTab = ""
shortcutCopyLastOutput = ""
shortcutSaveTerminalOutput = ""
shortcutTerminalFontUp = ""
shortcutTerminalFontDown = ""
shortcutTerminalFontReset = ""
shortcutToggleAgentChat = ""

# Los temas de fábrica comparten la base negra de «Cian técnico» y solo
# cambian el acento y la selección. themeRecolorAll = true deja que el tema
# recoloree también fondos, superficies y texto.
themeId = "silver"
themeRecolorAll = false
accentColor = "#b8bec6"
uiBackgroundColor = "#0d0d0d"
uiSurfaceColor = "#1e1e1e"
uiSurfaceAltColor = "#161616"
uiBorderColor = "#333333"
uiTextColor = "#d4d4d4"
uiMutedColor = "#888888"
terminalSelectionColor = "#4b5056"
fastfetchColor = "#b8bec6"
terminalCursorColor = "#b8bec6"
terminalBackground = "#0d0d0d"
terminalForeground = "#d4d4d4"
# Temas guardados por el usuario («Guardar como tema» en Ajustes).
customThemes = []
# 16 colores ANSI de la terminal; vacío = la paleta de xterm.
terminalAnsiColors = []
# Fuente instalada escrita a mano, delante de la familia elegida.
terminalFontCustom = ""
terminalFontFamily = "ubuntu-mono"
terminalFontSize = 12
terminalLineHeight = 1.5
terminalLetterSpacing = 0.0
terminalCursorStyle = "block"
terminalFontWeight = "normal"
terminalPadding = 10
terminalScrollback = 5000
terminalCursorBlink = true
# Enlaces clicables en la salida (Ctrl+clic): http, https y file, validados en
# el backend; con confirmación, el destino se muestra antes de abrirlo.
terminalCommandMarks = true
terminalLinks = true
terminalLinksConfirm = true
# Windows: el REPL de Python con el ancho visible y no con la reserva de 1024
# columnas (con pyreadline3 repinta toda la ventana a cada tecla).
pythonReplVisibleWidth = true
# Las órdenes de las acciones (instalar, actualizar…): false = se ven escribir
# poco a poco, como las repinta la shell; true = salen de una vez (de fábrica
# desde el 15-11, por petición de Romen).
actionCommandsAtOnce = true
# Si una IA (Grok, Codex…) acaba al abrirse pidiendo su clave de API, la
# pestaña ofrece meterla; se guarda cifrada para este usuario de Windows.
aiKeyOffer = true
# El chat lateral con los agentes de IA: preguntar sin entrar en su CLI.
agentChat = true
# Modo consejero: al fallar una orden, ofrecer preguntar al agente. Encendido de
# fábrica desde el 13-11 (Romen): solo ofrece, nunca pregunta solo.
agentChatAdvisor = true
# El botón «Chat» de la barra superior (abre y cierra el chat de agentes).
showAgentChatButton = true
# El chat recuerda la conversación: con cada pregunta va lo hablado antes.
agentChatRemember = true
# Los agentes del chat pueden editar la carpeta de la pestaña. Apagado de
# fábrica: solo leen (Codex en solo lectura, Qwen en `plan`). Encendido, el
# chat deja elegir «Aceptar ediciones» y «Auto».
agentChatCanEdit = false
# Deja elegir «Omitir permisos» en el chat: el agente hace todo sin preguntar,
# órdenes incluidas. Apagado de fábrica; pide también agentChatCanEdit.
agentChatAllowBypass = false
# Con cada pregunta del chat va, oculta, una guía corta de WTerminal para el
# agente: que proponga Entorno y dependencias, las órdenes internas (:shell,
# :panel, :set…) y los ajustes antes que winget, apt o pip a pelo, y cómo pedir
# la guía entera (wterminal --agent-guide).
agentChatGuide = true
# Al abrir la pestaña de una IA, su guía de WTerminal: Claude Code y Codex como
# instrucciones de arranque (no salen en la conversación); Gemini y Qwen como
# primer mensaje.
agentTabGuide = true
# Las IA que lanza WTerminal (sus pestañas y el chat) pueden manejarlo con
# `wterminal --ctl <orden>`: órdenes internas y acciones de Entorno y
# dependencias. Lo que cambie el equipo o los ajustes pide permiso en un aviso;
# los permisos del chat y la seguridad nunca se pueden tocar así.
agentControl = true
terminalScrollSensitivity = 3
copyOnSelect = false
uiDensity = "comfortable"
uiScale = 100
suggestRepositoryImport = true
lowPowerMode = false
lowPowerSuggest = true
# Si una orden no existe y WTerminal sabe instalarla, un aviso abajo lo ofrece
# (nunca instala nada solo), con «No volver a mostrar».
suggestMissingTools = true
# Si has cambiado ajustes y no hay ningún perfil portable en su carpeta
# (<carpeta propia>\configuracion\perfiles), un aviso sugiere guardar uno.
offerPortableProfile = true
githubSessionMode = "onExhausted"
# Privacidad y red: lo que WTerminal hace por su cuenta al arrancar.
checkUpdatesOnStartup = true
checkPackageUpdatesOnStartup = true
# Si falta WebView2 (Windows): "ask" (preguntar), "download" (descargarlo de
# Microsoft) o "never" (solo avisar).
webview2Missing = "ask"

defaultEnvironmentId = ""
terminalAdminByDefault = false
# Cachés de lenguajes y gestores de paquetes en una carpeta propia. Vacía = la
# de fábrica, «WTerminal/entornos» dentro de los datos locales del usuario.
toolchainStoreEnabled = true
# Categorías además de las cachés, todas activas salvo los proyectos de GitHub
# (siguen en Documentos): descargas del panel, modelos de IA, herramientas
# nuevas (npm -g, cargo install, go install, pip --user), historial de los
# REPL, toolchains completas (solo las que aún no estaban instaladas) y
# programas de WinGet y Chocolatey. Las carpetas bin de las herramientas van delante en el
# PATH de WTerminal y, con la integración con el PATH, también en el del
# usuario (`path_integration::sync_tool_bins`), así que se ven en cualquier
# terminal. Lo ya instalado no se mueve.
toolchainStoreDownloads = true
toolchainStoreAiModels = true
toolchainStoreTools = true
toolchainStoreReplHistory = true
toolchainStoreToolchains = true
toolchainStorePrograms = true
toolchainStoreProjects = false
# Configuración de los REPL (IPython, Jupyter; solo si aún no existía) y
# plugins de las shells (caché de starship).
toolchainStoreConfig = true
toolchainStorePlugins = true
# Carpeta propia de cada categoría, «categoría=carpeta» por línea; las que no
# salen van dentro de la carpeta propia.
toolchainStoreCategoryDirs = ""
# Entradas apagadas una a una aunque su categoría siga activa (ids separados
# por comas).
toolchainStoreDisabled = ""
# Sugerencias del historial y colores en la línea de órdenes (Clink en cmd,
# PSReadLine en PowerShell, ble.sh o plugins de zsh) si están instalados.
shellAssist = true
# Y shell por shell (solo cuentan con shellAssist activo).
shellAssistCmd = true
shellAssistPowershell = true
shellAssistBash = true
shellAssistZsh = true
# Si a la pestaña activa (cmd, PowerShell, bash o zsh) le falta su ayudante,
# un aviso abajo, como el de las actualizaciones, ofrece instalarlo, con
# «Ahora no» y «No volver a mostrar» (se recupera en su casilla o en Ajustes > Avisos).
offerShellAssist = true
# Aspecto de las sugerencias y del coloreado en todas las shells. Un color
# vacío deja el de cada herramienta (Clink, PSReadLine, ble.sh, zsh).
shellAssistSuggestionColor = ""
shellAssistSuggestionItalic = false
shellAssistSyntax = true
shellAssistCommandColor = ""
shellAssistArgumentColor = ""
shellAssistErrorColor = ""
shellAssistListView = true
toolchainStoreDir = ""
defaultScriptEnvironmentId = ""
fileManagerId = ""
viewportCols = 80
viewportRows = 24
