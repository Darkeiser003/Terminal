[package]
name = "winslim-terminal"
version = "1.0.0"
description = "WTerminal - terminal y hub de proyectos de Darkeiser003"
authors = ["Darkeiser003"]
license = "MIT"
publish = false
edition = "2021"
rust-version = "1.77"

# El nombre público del ejecutable debe ser el mismo tanto si se usa Cargo
# directamente como si se empaqueta con Tauri.
[[bin]]
name = "wterminal"
path = "src/main.rs"

# La librería conserva un nombre estable para que main.rs y los tests puedan
# compartir el punto de entrada sin depender del nombre del paquete.
[lib]
name = "winslim_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Los binarios de `cargo test` también usan controles nativos de Windows. El
# recurso solo se enlaza a los ejecutables de tests desde `build.rs` para que
# Common Controls v6 exponga `TaskDialogIndirect` en el contexto de prueba.
embed-resource = "3.0.11"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# ConPTY en Windows y forkpty en Unix, con la misma API. Sustituye a node-pty.
portable-pty = "0.9"

anyhow = "1"
parking_lot = "0.12"
regex = "1"
once_cell = "1"
# Runtime asíncrono propio con más hilos que el de fábrica de Tauri (uno por
# núcleo): los comandos `#[tauri::command(async)]` síncronos ocupan un hilo
# mientras esperan. Ya venía como dependencia de Tauri; no añade crates.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread"] }
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sysinfo = { version = "0.36.1", default-features = false, features = ["system", "disk"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
base64 = "0.23.1"
ring = "0.17"
libc = "0.2"
github-target = { path = "crates/github-target", version = "1.0.0" }

[target.'cfg(windows)'.dependencies]
# Lectura directa del Registro: evita arrancar `reg.exe` decenas de veces al
# construir por primera vez el banner del sistema.
winreg = "0.56"
# Preflight de WebView2: comprobar la firma Authenticode de su instalador
# (WinTrust), el aviso nativo de cuando falta (TaskDialog), sin interfaz web, y
# la consola de quien lanza `--install-webview2`.
# Es la misma versión que ya trae Tauri: no añade un crate nuevo.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_System_Console",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Para iterar pruebas (`npm run dev:test`): el mismo código y las mismas
# opciones que release, pero sin LTO, en muchas unidades y con compilación
# incremental, para que un cambio se recompile en uno o dos minutos y no en
# nueve. El binario queda en `target/fast/` y nunca se publica.
[profile.fast]
inherits = "release"
codegen-units = 256
incremental = true
lto = false
