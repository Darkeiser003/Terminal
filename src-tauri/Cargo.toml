[package]
name = "winslim-terminal"
version = "1.4.2"
description = "WinSlim Terminal - terminal y hub de proyectos de WinSlim Project"
authors = ["WinSlim Project"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.77"

# El binario se llama distinto por plataforma (ver src/identity.rs), pero el
# nombre de la librería es el punto de entrada común que usa main.rs.
[lib]
name = "winslim_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ConPTY en Windows y forkpty en Unix, con la misma API. Sustituye a node-pty.
portable-pty = "0.9"

anyhow = "1"
parking_lot = "0.12"
regex = "1"
once_cell = "1"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sysinfo = { version = "0.36.1", default-features = false, features = ["system", "disk"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
# Lectura directa del Registro: evita arrancar `reg.exe` decenas de veces al
# construir por primera vez el banner del sistema.
winreg = "0.55"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
