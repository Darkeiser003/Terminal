# Política reproducible de dependencias Rust. El paquete raíz sigue siendo
# UNLICENSED; esta lista solo cubre las licencias de terceros que se pueden
# incorporar al binario.

[advisories]
version = 2
# Las alertas transitorias se siguen mostrando en los informes, pero solo una
# alerta de una dependencia directa bloquea el proyecto. Las directas no deben
# introducir crates sin mantenimiento ni avisos de seguridad.
unmaintained = "workspace"
unsound = "workspace"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
