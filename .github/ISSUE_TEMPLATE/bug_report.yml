name: Bug report
description: Report a reproducible problem in LTerminal.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: For security vulnerabilities, use the private reporting link instead of this public form.
  - type: input
    id: version
    attributes:
      label: LTerminal version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the shell or environment involved, if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove personal data, tokens, and other secrets before posting.
    validations:
      required: false
