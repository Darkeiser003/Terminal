name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev xvfb
      - run: npm ci
      - name: Validate Linux build script
        if: runner.os == 'Linux'
        run: bash -n linux/build.sh
      - name: Validate Windows build scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'windows/build.ps1'), [ref]$null, [ref]$errors
          )
          if ($errors.Count) { $errors | Format-List; exit 1 }
          cmd /d /c "call windows\build.bat --help"
      - run: npm run check
      - name: Exercise installed shells and REPLs
        if: runner.os == 'Linux'
        run: npm run test:host

  appimage-smoke:
    name: AppImage smoke build
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev xvfb
      - run: npm ci
      - name: Build and validate AppImage
        run: xvfb-run -a bash linux/build.sh --no-run
      - name: Revalidate published artifact independently
        run: xvfb-run -a npm run test:release
      - uses: actions/upload-artifact@v4
        with:
          name: LTerminal-AppImage
          path: release/*.AppImage
          if-no-files-found: error

  e2e-linux:
    name: Tauri WebDriver E2E
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Native and WebDriver dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev xvfb webkit2gtk-driver
          cargo install tauri-driver --locked
      - run: npm ci
      - run: npm run e2e:build
      - name: Exercise the real desktop UI
        run: xvfb-run -a env E2E_BINARY="$PWD/src-tauri/target/debug/lterminal" npm run e2e
