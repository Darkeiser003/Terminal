name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 1 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Analizar prácticas de seguridad del repositorio
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      checks: read
      id-token: write
      issues: read
      pull-requests: read
      security-events: write
    steps:
      - name: Obtener fuentes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ejecutar OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Conservar SARIF para depuración
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          if-no-files-found: ignore
          retention-days: 5

      - name: Publicar resultados en Code Scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
