name: Revisión de dependencias

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Vulnerabilidades y licencias nuevas
    runs-on: ubuntu-latest
    steps:
      - name: Revisar dependencias añadidas o actualizadas
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # CI ya bloquea vulnerabilidades altas; aquí se evalúa además el
          # diff del PR, incluyendo dependencias de desarrollo/build.
          fail-on-severity: high
          fail-on-scopes: runtime,development,unknown
          allow-licenses: >-
            Apache-2.0,Apache-2.0 WITH LLVM-exception,BSD-2-Clause,BSD-3-Clause,
            BSL-1.0,CC0-1.0,CDLA-Permissive-2.0,ISC,LGPL-2.1-or-later,MIT,
            MIT-0,MPL-2.0,OpenSSL,Unicode-3.0,Unicode-DFS-2016,Unlicense,Zlib
