name: Wine

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-windows-under-wine:
    name: Tests Rust Windows bajo Wine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu
      - name: Toolchain MinGW y Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 wine64
      - run: npm ci
      - name: Compilar y ejecutar tests Windows con Wine
        run: bash linux/build-windows.sh --no-install --skip-checks --wine-rust-tests
        env:
          LTERMINAL_REQUIRE_SIGNING: '0'
