name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Calidad, tests y dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npm audit --audit-level=high --ignore-scripts
      - run: npm run check:local
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - uses: taiki-e/install-action@cargo-audit
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo audit --file src-tauri/Cargo.lock
      - run: cargo deny --manifest-path src-tauri/Cargo.toml check

  shell-policy:
    name: Shell y secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-build:
    name: Build Linux/AppImage
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependencias de AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf fuse3 file
      - run: npm ci
      - name: Compilar AppImage
        env:
          LTERMINAL_REQUIRE_SIGNING: '0'
        run: npm run dist:linux -- --no-run --no-extended-tests --no-install
      - uses: actions/upload-artifact@v4
        with:
          name: lterminal-appimage
          path: |
            release/**/*.AppImage
            release/**/SHA256SUMS.txt
            release/**/SHA256SUMS.txt.sig
          if-no-files-found: error
